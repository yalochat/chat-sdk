buildscript {
  ext.YaloChatReactNativeSdk = [
    kotlinVersion: "1.9.24",
    minSdkVersion: 24,
    compileSdkVersion: 35,
    yaloChatAndroidSdkVersion: "1.2.0"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return YaloChatReactNativeSdk[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.6.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "ai.yalo.chat.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
  }

  buildFeatures {
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "ai.yalo.chat:chat-android-sdk:${getExtOrDefault('yaloChatAndroidSdkVersion')}"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
  // The theme overrides are built from Compose colors, sizes and shapes. The
  // BOM matches the Android SDK's so it never raises what an app must compile with.
  implementation platform("androidx.compose:compose-bom:2025.11.00")
  implementation "androidx.compose.foundation:foundation"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20250517"
}
