buildscript {
  ext.YaloChatReactNativeSdk = [
    kotlinVersion: "2.1.20",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    yaloChatAndroidSdkVersion: "0.4.1"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return YaloChatReactNativeSdk[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.12.0"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
    classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"

android {
  namespace "ai.yalo.chat.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
  }

  buildFeatures {
    compose true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "ai.yalo.chat:chat-android-sdk:${getExtOrDefault('yaloChatAndroidSdkVersion')}"
  implementation platform("androidx.compose:compose-bom:2026.02.01")
  implementation "androidx.compose.material3:material3"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20250517"
}
