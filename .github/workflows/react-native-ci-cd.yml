name: React Native SDK Pipeline

on:
  push:
    branches:
      - 'main'
    tags:
      - 'react-native-sdk/v*.*.*'
    paths:
      - 'react-native-sdk/**'
      - '.github/workflows/react-native-ci-cd.yml'

  pull_request:
    paths:
      - 'react-native-sdk/**'
      - '.github/workflows/react-native-ci-cd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"
  # The JDK React Native recommends, which most integrators build with.
  JAVA_VERSION: "17"
  RUBY_VERSION: "3.3"
  # Matches compileSdkVersion, buildToolsVersion and ndkVersion in
  # example/android/build.gradle.
  ANDROID_PACKAGES: "platform-tools platforms/android-36 build-tools/36.0.0 ndk/27.1.12297006 cmake/3.22.1"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-native-sdk

    steps:
      - uses: actions/checkout@v6

      - name: Gitleaks Scan
        run: docker run --rm -v ${{ github.workspace }}:/code zricethezav/gitleaks:latest detect --source="/code" -v

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: react-native-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run coverage

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: react_native
          files: ./react-native-sdk/coverage/lcov.info

      - name: Pack
        # Builds lib/ and lists what the release would ship, so a broken
        # package fails on the pull request instead of at release time.
        run: npm pack --dry-run

  # The native builds use the android-sdk and ios-sdk versions the wrapper
  # declares, which are the ones integrators get, not the local checkouts.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./react-native-sdk

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: react-native-sdk/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        # Installed into the runner's SDK up front, so Gradle never has to
        # download them mid build.
        run: android sdk install --sdk="$ANDROID_HOME" ${{ env.ANDROID_PACKAGES }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      - name: Resolve android-sdk version
        id: android-sdk
        run: |
          VERSION="$(grep -oE 'yaloChatAndroidSdkVersion: "[^"]+"' android/build.gradle | cut -d '"' -f 2)"
          if [ -z "$VERSION" ]; then
            echo "ERROR: yaloChatAndroidSdkVersion not found in android/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Unit tests and example app
        working-directory: ./react-native-sdk/example/android
        # One architecture is enough to prove the native code compiles.
        run: |
          ./gradlew \
            :yalo-chat-react-native-sdk:testDebugUnitTest \
            :app:assembleDebug \
            -PyaloChatAndroidSdkVersion=${{ steps.android-sdk.outputs.version }} \
            -PreactNativeArchitectures=x86_64

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: react-native-android-test-results
          path: react-native-sdk/android/build/reports/tests/testDebugUnitTest/
          retention-days: 7

  ios:
    # Package.swift needs Swift 6.4, which only the Xcode 27 image ships.
    runs-on: xcode-27
    env:
      XCODE_VERSION: "27.0"
      YALO_CHAT_IOS_SDK_PATH: https://github.com/yalochat/chat-sdk.git
    defaults:
      run:
        working-directory: ./react-native-sdk

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: react-native-sdk/package-lock.json

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: ./react-native-sdk/example

      - name: Install dependencies
        run: npm ci

      - name: Install pods
        working-directory: ./react-native-sdk/example/ios
        run: bundle exec pod install

      - name: Build example app
        working-directory: ./react-native-sdk/example/ios
        run: |
          xcodebuild build \
            -workspace YaloChatReactNativeSdkExample.xcworkspace \
            -scheme YaloChatReactNativeSdkExample \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  rollout:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: [quality-gate, android, ios]
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ./react-native-sdk

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#react-native-sdk/v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be react-native-sdk/vX.Y.Z (got: $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assert tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "ERROR: releases must be tagged on a commit merged into main"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: react-native-sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Set package version
        # The tag is the source of truth, like VERSION_NAME on Android.
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
