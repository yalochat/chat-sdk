name: iOS SDK Pipeline

on:
  push:
    branches:
      - 'main'
    tags:
      - 'ios-sdk/v*.*.*'
    paths:
      - 'ios-sdk/**'
      - 'proto/swift/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/ios-ci-cd.yml'

  pull_request:
    paths:
      - 'ios-sdk/**'
      - 'proto/swift/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '.github/workflows/ios-ci-cd.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # macOS runners have no Docker, so the scan runs on Linux like the other SDKs.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Gitleaks Scan
        run: docker run --rm -v ${{ github.workspace }}:/code zricethezav/gitleaks:latest detect --source="/code" -v

  quality-gate:
    # Package.swift needs Swift 6.4, which only the Xcode 27 image ships.
    runs-on: xcode-27
    # A warm run takes a few minutes; a hung package fetch should not hold a macOS runner.
    timeout-minutes: 45
    env:
      XCODE_VERSION: "27.0"
      # Every xcodebuild call shares one build folder, kept inside Xcode's default
      # DerivedData root so the cache below also carries the SDK modules Xcode
      # precompiles there (minutes of work on a cold runner).
      DERIVED_DATA: /Users/runner/Library/Developer/Xcode/DerivedData/YaloChatSDK-CI
      RESULT_BUNDLE: ${{ github.workspace }}/.build/YaloChatSDK.xcresult

    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        id: xcode
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version
          echo "build=$(xcodebuild -version | awk '/Build version/ {print $3}')" >> "$GITHUB_OUTPUT"
          # A fresh checkout gives every file a new inode. Without this, Xcode
          # treats every restored build product as stale and rebuilds it.
          defaults write com.apple.dt.XCBuild IgnoreFileSystemDeviceInodeChanges -bool YES

      - name: Pick iPhone simulator
        id: simulator
        # The runtime that matches the selected Xcode's iOS SDK.
        run: |
          RUNTIME="SimRuntime.iOS-$(xcrun --sdk iphonesimulator --show-sdk-version | tr . -)"
          UDID="$(xcrun simctl list devices available -j | jq -r --arg runtime "$RUNTIME" '
            [.devices | to_entries[]
              | select(.key | endswith($runtime))
              | .value[] | select(.name | startswith("iPhone"))]
            | first | .udid')"
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "ERROR: no iPhone simulator for $RUNTIME"
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Start booting simulator
        # Boots in the background while the tests compile; "Wait for simulator"
        # blocks on it before they run, and retries the boot if this one failed.
        run: xcrun simctl boot "${{ steps.simulator.outputs.udid }}" || true

      - name: Restore build cache
        # Only main saves the cache (see "Save build cache"); pull requests and
        # tags restore main's latest.
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-derived-data-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.resolved', 'ios-sdk/YaloChatSDK.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ios-derived-data-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.resolved', 'ios-sdk/YaloChatSDK.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-
            ios-derived-data-${{ steps.xcode.outputs.build }}-

      - name: Build tests with coverage
        # Package versions come from the committed Package.resolved, so a
        # restored cache never goes to GitHub for them.
        run: |
          xcodebuild build-for-testing \
            -scheme YaloChatSDK \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Wait for simulator
        # Waits for the first boot to settle, so its background work does not
        # stall the tests that wait on a deadline.
        run: xcrun simctl bootstatus "${{ steps.simulator.outputs.udid }}" -b

      - name: Unit tests with coverage
        # A failure would otherwise collect a sysdiagnose, which takes minutes on a runner.
        run: |
          xcodebuild test-without-building \
            -collect-test-diagnostics never \
            -scheme YaloChatSDK \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULT_BUNDLE"

      - name: Coverage report
        run: xcrun xccov view --report --only-targets "$RESULT_BUNDLE"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-test-results
          path: ${{ env.RESULT_BUNDLE }}
          retention-days: 7

      - name: Publish coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ios
          plugins: xcode
          xcode_archive_path: ${{ env.RESULT_BUNDLE }}

      - name: Build release for device
        # Same configuration integrators compile. Skipped on pull requests to
        # keep them fast, since a release still waits for this on its tag.
        if: github.event_name != 'pull_request'
        run: |
          xcodebuild build \
            -scheme YaloChatSDK \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build example app
        run: |
          xcodebuild build \
            -workspace ios-sdk/YaloChatSDK.xcworkspace \
            -scheme ExampleApp \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Save build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-derived-data-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.resolved', 'ios-sdk/YaloChatSDK.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}-${{ github.sha }}

  # SwiftPM only resolves plain semver tags, so the ios-sdk/vX.Y.Z tag from YRK
  # gets a matching X.Y.Z tag on the same commit.
  rollout:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: [secrets-scan, quality-gate]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#ios-sdk/v}"
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: tag must be ios-sdk/vX.Y.Z (got: $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Assert tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "ERROR: releases must be tagged on a commit merged into main"
            exit 1
          fi

      - name: Guard against duplicate release
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "ERROR: tag $VERSION already exists. Delete it before re-running."
            exit 1
          fi

      - name: Tag SwiftPM version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name "DevEx self service"
          git config user.email "developer-acceleration@yalo.com"
          git tag -a "$VERSION" -m "iOS SDK $VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
